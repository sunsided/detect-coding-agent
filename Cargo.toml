[package]
name = "detect-coding-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.91.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
description = "Detect if your application is being invoked by an AI coding agent such as Claude Code, Copilot, Cursor, Codex, Gemini CLI, and many more."
license = "EUPL-1.2 OR MIT OR Apache-2.0"
repository = "https://github.com/sunsided/detect-coding-agent"
homepage = "https://github.com/sunsided/detect-coding-agent"
keywords = ["ai", "agent", "coding", "detection", "claude"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[features]
default = []

# Check the process ancestry for known agent executables in `detect()` / `detect_all()`, so agents
# without environment signals (e.g. Aider, Devin, Factory Droid, Octofriend) can be detected.
# Linux only for now (reads /proc, no subprocesses); on other platforms the ancestry is empty.
process-detection = []

# Check file-system markers left by agents (e.g. Devin's /opt/.devin) in `detect()` / `detect_all()`.
# The `*_with_env` functions never touch the file system.
fs-markers = []

[dependencies]

[dev-dependencies]

[[example]]
name = "detect"
path = "examples/detect.rs"
